<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>library-rag</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1c1b19; --muted: #6b6862;
    --line: #e5e1da; --accent: #7c4a2d; --accent-soft: #f2e9e2;
    --good: #2d6a4f; --warn: #9a6a00; --bad: #8a3a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --panel: #1e1d17; --ink: #ece8e1; --muted: #9a958c;
      --line: #302e26; --accent: #d3a17a; --accent-soft: #2a241d;
      --good: #6fbf94; --warn: #d9ab4a; --bad: #d98a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-serif, Georgia, "Times New Roman", serif;
  }
  header {
    border-bottom: 1px solid var(--line); padding: 18px 24px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  form { display: flex; gap: 10px; margin-bottom: 8px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 26px; }
  .examples button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    font-size: 13px; font-weight: 400; padding: 6px 11px; border-radius: 999px;
  }
  .examples button:hover { color: var(--ink); border-color: var(--accent); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px 22px; margin-bottom: 18px;
  }
  .answer p { margin: 0 0 14px; }
  .answer p:last-child, .answer ul:last-child, .answer ol:last-child { margin-bottom: 0; }
  .answer .mdh {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px;
    font-weight: 700; margin: 22px 0 10px; letter-spacing: -0.01em;
    text-transform: none; color: var(--ink);
  }
  .answer .mdh:first-child { margin-top: 0; }
  .answer ul, .answer ol { margin: 0 0 14px; padding-left: 22px; }
  .answer li { margin: 4px 0; }
  .answer blockquote {
    margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--accent-soft);
    color: var(--muted);
  }
  .answer code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em;
    background: var(--accent-soft); padding: 1px 5px; border-radius: 4px;
  }
  .answer strong { font-weight: 700; }
  .answer cite {
    font-style: normal; background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700;
    cursor: pointer; user-select: none; border: 1px solid transparent;
    vertical-align: 2px; margin: 0 1px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .answer cite:hover { border-color: var(--accent); }
  .answer cite.on { background: var(--accent); color: #fff; }
  /* Citation popover */
  #pop {
    position: absolute; z-index: 50; max-width: 560px; width: calc(100vw - 40px);
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.22);
    padding: 16px 18px; display: none;
  }
  #pop.show { display: block; }
  #pop .meta {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
    color: var(--muted); display: grid; grid-template-columns: auto 1fr;
    gap: 3px 12px; margin-bottom: 12px;
  }
  #pop .meta dt { color: var(--muted); }
  #pop .meta dd { margin: 0; color: var(--ink); }
  #pop .quote {
    font-size: 14px; max-height: 300px; overflow-y: auto;
    border-left: 3px solid var(--accent-soft); padding-left: 12px;
    white-space: pre-wrap;
  }
  #pop .close {
    position: absolute; top: 10px; right: 12px; cursor: pointer;
    color: var(--muted); background: none; border: 0; font-size: 18px; padding: 0;
  }
  #pop .title {
    font-weight: 700; font-size: 14px; margin: 0 24px 8px 0;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 14px; font-weight: 600;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
        .badge {
    font-size: 11px; font-family: ui-sans-serif, system-ui, sans-serif;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
    color: var(--muted);
  }
  .status { color: var(--muted); font-size: 14px; }
    .trace { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; }
  .step { padding: 9px 0; border-top: 1px dashed var(--line); }
  .step:first-child { border-top: 0; }
  .step .q { font-weight: 600; color: var(--ink); }
  .step .lbl {
    display: inline-block; min-width: 74px; color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  }
  .step .think { color: var(--muted); font-style: italic; font-family: inherit; }
  .hits { margin: 6px 0 0 74px; color: var(--muted); font-size: 12px; }
  .hits div { padding: 1px 0; }
  .hits .w { opacity: .5; }
  .hits b { color: var(--accent); font-weight: 700; }
  .err { color: var(--bad); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px;
    font-family: ui-sans-serif, system-ui, sans-serif; }
  .lib { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .lib li { margin: 3px 0; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .loading { animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<header>
  <h1>library-rag</h1>
  <span class="sub" id="libsummary">loading index…</span>
</header>

<main>
  <form id="f">
    <input type="text" id="q" placeholder="Ask about the Holy Spirit, doctrine, an epistle…" autocomplete="off" autofocus>
    <button type="submit" id="go">Ask</button>
  </form>

  <div class="examples" id="ex">
    <button>Who is the Holy Spirit?</button>
    <button>How do these books differ on baptism in the Holy Spirit?</button>
    <button>What are the qualifications of an elder?</button>
    <button>How can I know I have eternal life?</button>
    <button>What is the best way to change a car tyre?</button>
  </div>

  <div id="out"></div>

  <details class="card">
    <summary>What's in the index</summary>
    <ul class="lib" id="lib"></ul>
  </details>
</main>

<div id="pop">
  <button class="close" id="popclose" aria-label="close">&times;</button>
  <div class="title" id="poptitle"></div>
  <dl class="meta" id="popmeta"></dl>
  <div class="quote" id="popquote"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/books').then(r => r.json()).then(d => {
  $('#libsummary').textContent =
    `${d.books.length} books · ${d.total_chunks.toLocaleString()} chunks indexed`;
  $('#lib').innerHTML = d.books.map(b =>
    `<li>${esc(b.title)} — ${b.pages ?? '?'} pages, ${b.chunks} chunks</li>`).join('');
}).catch(() => $('#libsummary').textContent = 'index unavailable');

$('#ex').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') { $('#q').value = e.target.textContent; $('#f').requestSubmit(); }
});


// Minimal markdown -> HTML. Escapes first, so nothing the model writes can
// inject markup; only the subset below is promoted back to tags. claude.ai
// renders markdown too -- the raw ** you were seeing was us not rendering it.
function md(text, citeFn) {
  const blocks = esc(text).trim().split(/\n{2,}/);
  const inline = t => {
    // Non-greedy, and NOT [^*]+ -- that form fails on "**bold with *italic*
    // inside**" and leaves the raw ** on the page. Bold runs before italic so
    // the inner single asterisks are still there to match on the next pass.
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
         .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>')
         .replace(/`([^`]+)`/g, '<code>$1</code>')
         .replace(/&quot;([^&]{1,200}?)&quot;/g, '\u201c$1\u201d');
    return citeFn ? citeFn(t) : t;
  };
  return blocks.map(b => {
    b = b.trim();
    const h = b.match(/^(#{1,6})\s+(.*)$/s);
    if (h) return `<h${Math.min(h[1].length + 2, 6)} class="mdh">${inline(h[2].trim())}</h${Math.min(h[1].length + 2, 6)}>`;
    if (/^([-*+]|\d+[.)])\s/.test(b)) {
      const ordered = /^\d/.test(b);
      const items = b.split(/\n(?=([-*+]|\d+[.)])\s)/).filter(x => x && /^([-*+]|\d+[.)])\s/.test(x));
      const li = items.map(i => `<li>${inline(i.replace(/^([-*+]|\d+[.)])\s+/, '').trim())}</li>`).join('');
      return ordered ? `<ol>${li}</ol>` : `<ul>${li}</ul>`;
    }
    if (/^&gt;\s/.test(b)) return `<blockquote>${inline(b.replace(/^&gt;\s?/gm, ''))}</blockquote>`;
    return `<p>${inline(b).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

// ---- Citation popover ----
// One source-of-truth map keyed by citation number; both modes populate it, so
// [n] in the prose always resolves to the exact passage the model was given.
let SOURCES = {};

function bodyOf(s) {
  // content has the heading trail prepended by chunking.py; show the prose only.
  const parts = s.content.split('\n\n');
  return parts.length > 1 ? parts.slice(1).join('\n\n') : s.content;
}

function showCite(el, n) {
  const s = SOURCES[n];
  const pop = $('#pop');
  if (!s) return;
  document.querySelectorAll('.answer cite.on').forEach(c => c.classList.remove('on'));
  el.classList.add('on');

  $('#poptitle').textContent = s.book;
  const rows = [
    ['Section', s.heading_trail ? s.heading_trail.replace(/\*\*/g, '') : '—'],
    ['Page', s.pages + (s.book_pages ? ` of ${s.book_pages}` : '')],
    ['Passage', s.ordinal != null ? `${s.ordinal + 1} of ${s.total_chunks}` : '—'],
    ['Length', s.tokens != null ? `${s.tokens} tokens` : '—'],
    ['Distance', `${s.distance}${s.distance <= 0.70 ? '' : ' (weak)'}`],
  ];
  $('#popmeta').innerHTML = rows
    .map(([k, v]) => `<dt>${k}</dt><dd>${esc(String(v))}</dd>`).join('');
  $('#popquote').textContent = bodyOf(s);

  pop.classList.add('show');
  const r = el.getBoundingClientRect();
  const w = pop.offsetWidth;
  let left = r.left + window.scrollX - w / 2 + r.width / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  let top = r.bottom + window.scrollY + 8;
  if (top + pop.offsetHeight > window.scrollY + window.innerHeight) {
    top = r.top + window.scrollY - pop.offsetHeight - 8;
  }
  pop.style.left = left + 'px';
  pop.style.top = Math.max(8, top) + 'px';
}

function hideCite() {
  $('#pop').classList.remove('show');
  document.querySelectorAll('.answer cite.on').forEach(c => c.classList.remove('on'));
}

$('#popclose').addEventListener('click', hideCite);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCite(); });
document.addEventListener('click', e => {
  const cite = e.target.closest('.answer cite');
  if (cite) { showCite(cite, cite.dataset.n); e.stopPropagation(); return; }
  if (!e.target.closest('#pop')) hideCite();
});

const citeSpans = html =>
  html.replace(/\[(\d+)\]/g, (m, n) => SOURCES[n]
    ? `<cite data-n="${n}" title="${esc(SOURCES[n].book)} \u2014 ${esc(SOURCES[n].pages)}">${n}</cite>`
    : m);
const citeify = text => md(text, citeSpans);

// ---- Research mode: SSE, render the loop as it happens ----
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const question = $('#q').value.trim();
  if (!question) return;
  $('#go').disabled = true;

  const steps = [];
  const paint = (answerHtml, sources) => {
    $('#out').innerHTML =
      (answerHtml ? `<div class="card"><div class="answer">${answerHtml}</div></div>` : '') +
      `<details class="card"><summary>How this was researched — ${steps.filter(s => s.t === 'search').length} searches</summary>
         <div class="trace">${steps.map(s => s.html).join('')}</div></details>` +
      '';
  };
  steps.push({ t: 'x', html: `<div class="step status loading"><span class="lbl">start</span> thinking…</div>` });
  paint('', null);

  try {
    const r = await fetch('/api/research', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question, k: 8 })
    });
    if (!r.ok) throw new Error(r.statusText);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', answerHtml = '', rawAnswer = '', sources = null;
    steps.length = 0;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const e = JSON.parse(p.slice(6));
        if (e.type === 'thinking') {
          steps.push({ t: 'think', html: `<div class="step"><span class="lbl">reasoning</span><span class="think">${esc(e.text)}</span></div>` });
        } else if (e.type === 'search') {
          steps.push({ t: 'search', html: e.query
            ? `<div class="step"><span class="lbl">search</span><span class="q">“${esc(e.query)}”</span>${e.book_id ? ` <span class="badge">book ${e.book_id}</span>` : ''}</div>`
            : `<div class="step"><span class="lbl">tool</span><span class="q">list_books</span></div>` });
        } else if (e.type === 'results') {
          const last = steps[steps.length - 1];
          last.html += `<div class="hits">${e.hits.map(h =>
            `<div class="${h.weak ? 'w' : ''}"><b>[${h.n}]</b> d=${h.distance} · ${esc(h.book).slice(0,40)} ${h.pages}${h.heading ? ' · ' + esc(h.heading).slice(0,54) : ''}</div>`
          ).join('')}${e.strong === 0 ? '<div class="w">— no strong matches; agent should rephrase</div>' : ''}</div>`;
        } else if (e.type === 'answer') {
          rawAnswer = e.text;
        } else if (e.type === 'done') {
          sources = e.sources.map(s => ({ ...s, relevant: s.distance <= 0.70 }));
          SOURCES = Object.fromEntries(sources.map(x => [String(x.n), x]));
          answerHtml = citeify(rawAnswer);
        } else if (e.type === 'error') {
          throw new Error(e.message);
        }
        paint(answerHtml, sources);
      }
    }
  } catch (err) {
    $('#out').insertAdjacentHTML('beforeend', `<div class="card err">${esc(String(err.message || err))}</div>`);
  } finally {
    $('#go').disabled = false;
  }
});

</script>
</body>
</html>
