[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-rag"
version = "0.1.0"
description = "RAG library tutor over a shared Google Drive of theology PDFs (Phase 1: ingestion pipeline)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    # Pinned exactly. pymupdf4llm decides what document structure the rest of
    # the pipeline can see, and that behaviour changes between releases:
    # use_layout() does not exist before 1.28, and the default path changed in
    # it. An open range here silently swaps the extraction engine underneath a
    # corpus that has already been calibrated against one. Bump deliberately,
    # and re-run the chunk comparison when you do.
    "pymupdf4llm==1.28.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "langchain-text-splitters>=0.3.0",
    "voyageai>=0.3.0",
    "tiktoken>=0.8.0",
    "mistralai>=1.2.0",
    # The local web UI (api.py + static/). Not needed by the pipeline itself,
    # but declared here rather than as an extra so a plain `pip install -e .`
    # gives a working `uvicorn api:app`.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned exactly. A linter's rule set grows between releases, so an open
    # range means a commit that changes nothing can turn CI red the day ruff
    # ships a new default rule (UP045 did exactly that). Bump deliberately.
    "ruff==0.15.22",
]

# Flat top-level scripts + the two subpackages. Listing py-modules explicitly so
# `pip install -e .` exposes `import config`, `import db`, `python -m migrate`, etc.
[tool.setuptools]
py-modules = ["config", "db", "ingest", "search", "evaluate", "report", "migrate", "explore"]

[tool.setuptools.packages.find]
include = ["agent*", "drive*", "pipeline*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
