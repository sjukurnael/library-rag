[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-rag"
version = "0.1.0"
description = "RAG library tutor over a shared Google Drive of theology PDFs (Phase 1: ingestion pipeline)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "langchain-text-splitters>=0.3.0",
    "voyageai>=0.3.0",
    "tiktoken>=0.8.0",
    "mistralai>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Flat top-level scripts + the two subpackages. Listing py-modules explicitly so
# `pip install -e .` exposes `import config`, `import db`, `python -m migrate`, etc.
[tool.setuptools]
py-modules = ["config", "db", "ingest", "search", "report", "migrate", "explore"]

[tool.setuptools.packages.find]
include = ["agent*", "drive*", "pipeline*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
