[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-rag"
version = "0.1.0"
description = "RAG library tutor over a shared Google Drive of theology PDFs (Phase 1: ingestion pipeline)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    # Pinned exactly. pymupdf4llm decides what document structure the rest of
    # the pipeline can see, and that behaviour changes between releases:
    # use_layout() does not exist before 1.28, and the default path changed in
    # it. An open range here silently swaps the extraction engine underneath a
    # corpus that has already been calibrated against one. Bump deliberately,
    # and re-run the chunk comparison when you do.
    "pymupdf4llm==1.28.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "langchain-text-splitters>=0.3.0",
    "voyageai>=0.3.0",
    "tiktoken>=0.8.0",
    "mistralai>=1.2.0",
    # The local web UI (api.py + static/). Not needed by the pipeline itself,
    # but declared here rather than as an extra so a plain `pip install -e .`
    # gives a working `uvicorn api:app`.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # FastAPI parses multipart/form-data (the PDF upload endpoint) only when
    # this is installed; without it the route raises at import time, not at
    # request time, so it is a hard dependency rather than an extra.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Pinned exactly. A linter's rule set grows between releases, so an open
    # range means a commit that changes nothing can turn CI red the day ruff
    # ships a new default rule (UP045 did exactly that). Bump deliberately.
    "ruff==0.15.22",
]

[project.scripts]
# `python -m library_rag.cli.<name>` always works too; these are the short form.
library-rag-ingest = "library_rag.cli.ingest:main"
library-rag-search = "library_rag.cli.search:main"
library-rag-evaluate = "library_rag.cli.evaluate:main"
library-rag-migrate = "library_rag.cli.migrate:main"
library-rag-report = "library_rag.cli.report:main"
library-rag-explore = "library_rag.cli.explore:main"

# src layout: the package is importable ONLY once installed, so a test can never
# accidentally pass by picking up the working directory instead of the thing
# that would actually ship.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Files the package needs at runtime and must carry with it. The corpus in
# data/ is deliberately NOT here -- that is the user's, and lives at the repo
# root (see config.PROJECT_ROOT).
library_rag = ["web/static/*", "evaluation/questions/*.json"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
# No pythonpath entry: with a src layout the package must be installed
# (`pip install -e ".[dev]"`), which is what makes the tests exercise the
# installed package rather than whatever happens to be in the CWD.
testpaths = ["tests"]
