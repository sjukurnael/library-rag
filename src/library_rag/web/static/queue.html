  <div class="page">
    <div class="pagehead">
      <h1>Processing</h1>

        Upload a PDF

    </div>
    <div class="pagebody">

      <div class="tiles">
        <div class="tile accent"><div class="n" id="t-active">–</div><div class="l">In progress</div></div>
        <div class="tile"><div class="n" id="t-done">–</div><div class="l">Indexed books</div></div>
        <div class="tile"><div class="n" id="t-chunks">–</div><div class="l">Searchable passages</div></div>
        <div class="tile bad"><div class="n" id="t-failed">–</div><div class="l">Need attention</div></div>
      </div>

      <div class="sectionhead" id="queuehead">Queue</div>
      <div class="runs" id="runs"><div class="empty">loading…</div></div>

      <div class="sectionhead">Indexed</div>
      <div class="runs" id="doneruns"></div>

    </div>
  </div>

</div>

<script src="/static/app.js"></script>
<script>
// The pipeline as the user sees it. `status` records the LAST COMPLETED stage
// (see STAGE in app.js), so the step in flight is the one AFTER it -- a book
// at 'downloaded' is being read, not downloaded.
const STEPS = ['Download', 'Read pages', 'Split', 'Embed'];
const CURRENT = { discovered: 0, downloaded: 1, extracted: 2, chunked: 3 };

function stepsBar(b) {
  const cur = CURRENT[b.status] ?? -1;
  return `<div class="steps">` + STEPS.map((s, i) => {
    const cls = i < cur ? 'done' : i === cur ? 'now' : 'todo';
    const bubble = i < cur ? '✓' : i + 1;
    return (i ? `<span class="conn${i <= cur ? ' done' : ''}"></span>` : '') +
           `<span class="st ${cls}"><span class="b">${bubble}</span>${s}</span>`;
  }).join('') + `</div>`;
}

function srcBadge(b) {
  return `<span class="badge">${b.source === 'drive' ? 'Drive' : 'Upload'}</span>`;
}

// "Open PDF" on a book that stopped -- the point of which is to SEE the file,
// not to fix it. A stopped book is a claim about a document ("empty", "no text
// layer") and the only way to check a claim like that is to look.
//
// Deliberately /api/books/{id}/pdf and NOT the Drive link already on the title:
// they answer different questions. Drive shows what Drive holds; this shows the
// bytes THE PIPELINE saw -- the ones the extractor actually choked on. They are
// normally identical, and the moment they are not is exactly the moment this is
// worth having. It is also instant here: a book only reaches a terminal state
// after its download step, so the local copy exists.
function inspect(b) {
  // A known-empty file must NOT be handed to the PDF viewer. The route serves
  // it honestly -- 200, application/pdf, zero bytes -- and the browser then says
  // "Failed to load PDF document.", which reads as a broken app and buries the
  // one fact that matters: there is nothing in the file. We already know the
  // size, so answer here instead of letting the viewer guess.
  if (b.size_bytes === 0) {
    return `<span class="open off" title="This file has no bytes in it -- there ` +
           `is nothing for a PDF viewer to show. Use the title link to check it ` +
           `at the source.">Empty file</span>`;
  }
  return `<a class="open" href="/api/books/${b.id}/pdf" target="_blank" rel="noopener"
    title="Open the PDF the pipeline read">Open PDF</a>`;
}

// An empty source file is the one failure whose cause is completely knowable
// without opening anything, so say it on the card. Everything else stays quiet
// -- a byte count on a healthy book is noise.
function sizeBadge(b) {
  if (b.size_bytes !== 0) return '';
  return `<span class="badge bad">0 bytes — the source file is empty</span>`;
}

// The title, linked to the original file when the API gave us somewhere to
// send it. New tab: the processing page polls, and navigating away from it
// mid-run is the one thing someone watching a queue does not want.
function titleCell(b) {
  const t = esc(b.title);
  return b.url
    ? `<div class="t"><a href="${esc(b.url)}" target="_blank" rel="noopener">${t}</a></div>`
    : `<div class="t">${t}</div>`;
}

function pendingRow(b) {
  const terminal = TERMINAL.has(b.status);
  if (terminal) {
    const msg = b.status === 'needs_ocr'
      ? 'Needs OCR — this PDF has no text layer. Set MISTRAL_API_KEY and reset it.'
      : `Failed — ${b.error || 'unknown error'}`;
    return `<div class="run failed"><span class="dot"></span>
      <div class="who">
        ${titleCell(b)}
        <div class="m">${srcBadge(b)}<span class="badge bad">${esc(b.status)}</span>${sizeBadge(b)}</div>
        <div class="errline">${esc(msg)}</div>
      </div>
      <div class="side">${inspect(b)}<button class="del" data-id="${b.id}" data-title="${esc(b.title)}"
        title="Remove this book">&times;</button></div></div>`;
  }
  // claim_age_s is Postgres's clock, not the browser's: silence is the thing
  // worth surfacing, and a skewed local clock must not fake or hide it.
  const wait = b.claim_age_s != null ? `working for${age(b.claim_age_s)}` : 'waiting for a worker';
  const pages = b.pages && (b.status === 'extracted' || b.status === 'chunked')
    ? `<span class="badge">${b.pages} pages</span>` : '';
  return `<div class="run working"><span class="dot"></span>
    <div class="who">
      ${titleCell(b)}
      <div class="m">${srcBadge(b)}${pages}<span>${esc(stageLabel(b))}${b.claim_age_s == null && b.status === 'discovered' ? ' — waiting for a worker' : '… ' + esc(wait)}</span></div>
      ${stepsBar(b)}
    </div>
    <div class="side"></div></div>`;
}

function doneRow(b) {
  return `<div class="run done"><span class="dot"></span>
    <div class="who">
      <div class="t">${esc(b.title)}</div>
      <div class="m"><span class="badge good">Indexed</span>
        <span>${b.pages ?? '?'} pages · ${b.chunks} passages</span>
        <span class="addmsg" data-msg="${b.id}"></span></div>
    </div>
    <div class="side">
      <button class="btn addbook" data-add="${b.id}" data-title="${esc(b.title)}"
        title="Add this book to a classroom">Add to classroom</button>
      <button class="del" data-id="${b.id}" data-title="${esc(b.title)}"
        title="Remove this book">&times;</button></div></div>`;
}

/* The shared dialog in app.js, so this page and the run page ask the question
   the same way. No default shelf here -- unlike a run, a book in the indexed
   list has no classroom it obviously belongs to. */
function addBook(btn) {
  const msg = document.querySelector(`.addmsg[data-msg="${btn.dataset.add}"]`);
  pickClassroom({
    bookId: btn.dataset.add,
    title: btn.dataset.title,
    addedBy: 'reader',
    onAdded: (roomId, room) => {
      btn.disabled = true;
      btn.textContent = 'Added';
      if (msg) msg.innerHTML = `<span class="ok">on ${esc(room ? room.name : 'the shelf')}</span>`;
    },
  });
}

// Delegated: the indexed list is replaced wholesale every refresh, so a
// listener bound to a button would not survive the next poll.
$('#doneruns').addEventListener('click', e => {
  const b = e.target.closest('button[data-add]');
  if (b) addBook(b);
});

// Clearing the stopped books. Only `failed` and `needs_ocr` -- a stuck book
// has no passages, so nothing searchable is lost, and the PDFs stay in the
// Drive mirror and can be indexed again. The server enforces that; this is just
// the way to ask for it.
const SPANS = [
  ['0', 'Everything stopped'],
  ['24', 'Older than 24 hours'],
  ['168', 'Older than 7 days'],
  ['720', 'Older than 30 days'],
];

async function countStuck(hours) {
  const q = hours ? `?older_than_hours=${hours}` : '';
  try { return (await fetchJSON(`/api/books/stuck${q}`, {}, 15000)).total; }
  catch { return null; }
}

async function clearStuck() {
  const r = await openDialog({
    title: 'Clear stopped books',
    note: 'These are books that failed or need OCR. They have no passages, so '
        + 'nothing searchable is removed — the PDFs stay in your Drive and can '
        + 'be indexed again later.',
    confirm: 'Clear',
    danger: true,
    fields: [{ name: 'hours', label: 'How far back', choices: SPANS, value: '0',
               hint: 'Counting…' }],
    // The count is the whole confirmation. A number you have not seen is not
    // something you can agree to.
    onChange: async (v, wrap) => {
      const hint = wrap.querySelector('.hint[data-for="hours"]');
      if (!hint) return;
      const n = await countStuck(Number(v.hours));
      if (!wrap.isConnected) return;   // dialog closed while we were counting
      hint.textContent = n === null ? 'Could not count them.'
        : n === 0 ? 'Nothing matches — nothing will be removed.'
        : `${n.toLocaleString()} book(s) will be removed.`;
    },
  });
  if (!r) return;
  const hours = Number(r.hours) || null;
  try {
    const out = await fetchJSON('/api/books/stuck/clear', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ older_than_hours: hours }),
    }, 120000);
    booksLimit = 50;
    await refreshBooks();
    await openDialog({
      title: `Removed ${out.deleted.toLocaleString()} book(s)`,
      note: out.removed_files
        ? `${out.removed_files} file(s) were deleted with them.`
        : 'No stored files needed removing.',
      fields: [], confirm: 'OK', cancel: 'Close',
    });
  } catch (e) {
    // A timeout says nothing about whether the SERVER finished. This one had
    // not: 353 books took over two minutes, the browser gave up at 120s, and
    // the page announced a failure for a deletion that completed a minute
    // later. For a destructive call, "the request failed" and "the work did
    // not happen" are different claims and only the second one matters -- so
    // ask what is actually left rather than reporting the request.
    const left = await countStuck(hours);
    await refreshBooks();
    await openDialog({
      title: left === 0 ? 'Cleared' : 'Could not finish clearing',
      note: left === null
        ? `${e.message || e}\n\nOpen the Processing page to see what remains.`
        : left === 0
          ? 'The request did not come back in time, but the books were removed.'
          : `${e.message || e}\n\n${left.toLocaleString()} still stopped. `
            + 'Nothing else was touched — run it again to finish.',
      fields: [], confirm: 'OK', cancel: 'Close',
    });
  }
}

onBooks((d, err) => {
  if (err) { $('#qsub').textContent = 'server unreachable'; return; }
  const pending = d.pending || [];
  const active = pending.filter(b => !TERMINAL.has(b.status));
  const stuck = pending.filter(b => TERMINAL.has(b.status));

  $('#t-active').textContent = active.length;
  $('#t-done').textContent = d.total_books.toLocaleString();
  $('#t-chunks').textContent = d.total_chunks.toLocaleString();
  $('#t-failed').textContent = stuck.length;
  $('#qsub').textContent = active.length
    ? `${active.length} book(s) in flight — updates every 3s`
    : 'nothing is processing right now';

  // The clear control lives on the QUEUE heading, beside the list it empties.
  const qh = $('#queuehead');
  if (qh) {
    qh.innerHTML = 'Queue' + (stuck.length
      ? ` <button class="btn clearstuck" id="clearstuck">Clear ${stuck.length} stopped</button>`
      : '');
    const cb = $('#clearstuck');
    if (cb) cb.onclick = clearStuck;
  }

  $('#runs').innerHTML = pending.length
    ? pending.map(pendingRow).join('')
    : `<div class="empty">The queue is empty. Upload a PDF here, or pick a book
       on the <a href="/library">Drive page</a> — it will appear here the moment
       it is queued.</div>`;
  // One page of a list 8,679 long. The count above is the real total; this is
  // a window onto it, and the button asks for a wider one.
  const more = d.total_books - d.books.length;
  $('#doneruns').innerHTML = (d.books.length
      ? d.books.map(doneRow).join('')
      : `<div class="empty">Nothing indexed yet.</div>`)
    + (more > 0
        ? `<div class="morerow"><button class="btn" id="morebooks">Show 50 more</button>
             <span class="sub">${d.books.length.toLocaleString()} of
             ${d.total_books.toLocaleString()}</span></div>`
        : '');
  const btn = $('#morebooks');
  if (btn) btn.onclick = () => { btn.disabled = true; btn.textContent = 'Loading…'; showMoreBooks(); };
});

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';                       // so re-picking the same file re-fires
  const note = $('#uploadnote');
  note.className = 'uploadnote';
  note.textContent = `uploading ${file.name}…`;

  const body = new FormData();
  body.append('file', file);
  try {
    const r = await fetch('/api/books/upload', { method: 'POST', body });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || `upload failed (${r.status})`);
    note.textContent = d.already_indexed
      ? `${d.title} is already indexed — nothing to do.`
      : `${d.title} queued.`;
    // The row appears in the queue below immediately; the poller tracks it
    // through every stage from here.
    refreshBooks();
  } catch (err) {
    note.className = 'uploadnote err';
    note.textContent = err.message;
  }
});

refreshBooks();
</script>
</body>
</html>
