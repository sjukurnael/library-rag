<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — chat</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand"><span class="logo"></span>Library</div>
    <nav class="snav">
      <a href="/" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat</a>
      <a href="/library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Drive</a>
      <a href="/queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Processing</a>
    </nav>
    <div class="sidebooks">
      <button class="sidehead" id="bookstoggle" aria-expanded="false">
        <span class="chev">▸</span> In the index
        <span class="count" id="bookcount"></span>
      </button>
      <ul id="navbooks" hidden></ul>
    </div>
    <div class="sidefoot" id="sidefoot">loading…</div>
  </aside>

  <div class="page">
    <div class="chatwrap">
      <div class="msgs" id="msgs">
        <div class="hello" id="hello">
          <div class="hi">Hello.</div>
          <div class="sub">What would you like to study today?</div>
          <div class="examples" id="ex">
            <button>Who is the Holy Spirit?</button>
            <button>How do these books differ on baptism in the Holy Spirit?</button>
            <button>What are the qualifications of an elder?</button>
            <button>How can I know I have eternal life?</button>
            <button>What was Paul asking of Philemon?</button>
            <button>What kinds of psalms are there?</button>
          </div>
        </div>
      </div>
      <div class="composer">
        <form id="f">
          <input type="text" id="q" placeholder="Ask the library…" autocomplete="off" autofocus>
          <button type="submit" class="send" id="go" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.9-7.7c.8-.36.8-1.5 0-1.84L3.4 3.16a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 5.05c0 .71.73 1.2 1.39.91z"/></svg>
          </button>
        </form>
        <div class="note">Answers come only from the indexed books. Click a citation to see the source passage.</div>
      </div>
    </div>
  </div>

</div>

<div id="panel" aria-hidden="true">
  <div class="phead">
    <div class="ptitle" id="ptitle"></div>
    <button class="close" id="pclose" aria-label="Close">&times;</button>
  </div>
  <div class="pbody">
    <dl class="meta" id="pmeta"></dl>
    <a id="ppdf" class="btn soft" target="_blank" rel="noopener" style="margin-bottom:16px" hidden>
      Open the PDF at this page ↗
    </a>
    <div class="rawhead">Original passage (markdown)</div>
    <div class="raw" id="praw"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
// Minimal markdown -> HTML for the ANSWER only. Escapes first, so nothing the
// model writes can inject markup; only the subset below is promoted back to
// tags. The user never sees raw markdown here -- the original text lives in
// the citation panel instead.
function md(text, citeFn) {
  const blocks = esc(text).trim().split(/\n{2,}/);
  const inline = t => {
    // Non-greedy, and NOT [^*]+ -- that form fails on "**bold with *italic*
    // inside**" and leaves the raw ** on the page. Bold runs before italic so
    // the inner single asterisks are still there to match on the next pass.
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
         .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>')
         .replace(/`([^`]+)`/g, '<code>$1</code>')
         .replace(/&quot;([^&]{1,200}?)&quot;/g, '“$1”');
    return citeFn ? citeFn(t) : t;
  };
  return blocks.map(b => {
    b = b.trim();
    const h = b.match(/^(#{1,6})\s+(.*)$/s);
    if (h) return `<h${Math.min(h[1].length + 2, 6)} class="mdh">${inline(h[2].trim())}</h${Math.min(h[1].length + 2, 6)}>`;
    if (/^([-*+]|\d+[.)])\s/.test(b)) {
      const ordered = /^\d/.test(b);
      const items = b.split(/\n(?=([-*+]|\d+[.)])\s)/).filter(x => x && /^([-*+]|\d+[.)])\s/.test(x));
      const li = items.map(i => `<li>${inline(i.replace(/^([-*+]|\d+[.)])\s+/, '').trim())}</li>`).join('');
      return ordered ? `<ol>${li}</ol>` : `<ul>${li}</ul>`;
    }
    if (/^&gt;\s/.test(b)) return `<blockquote>${inline(b.replace(/^&gt;\s?/gm, ''))}</blockquote>`;
    return `<p>${inline(b).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

// ---- Citation panel ----
// Sources are PER TURN: two questions can both have a source [1], and each
// citation must resolve to the passage its own run was given.
const TURNS = [];

function showSource(ti, n) {
  const s = (TURNS[ti] || {})[n];
  if (!s) return;
  document.querySelectorAll('.answer cite.on').forEach(c => c.classList.remove('on'));
  const el = document.querySelector(`.answer cite[data-t="${ti}"][data-n="${n}"]`);
  if (el) el.classList.add('on');

  $('#ptitle').textContent = s.book;
  // Everything the retrieval layer knows about this passage. The panel is the
  // one place metadata appears, so nothing is trimmed for tidiness.
  const rows = [
    ['Section', s.heading_trail ? s.heading_trail.replace(/\*\*/g, '') : '—'],
    ['Pages', s.pages + (s.book_pages ? ` (book has ${s.book_pages})` : '')],
    ['Passage', s.ordinal != null ? `${s.ordinal + 1} of ${s.total_chunks}` : '—'],
    ['Length', s.tokens != null ? `${s.tokens} tokens` : '—'],
    ['Distance', `${s.distance}${s.distance <= 0.70 ? '' : ' (weak match)'}`],
    ['Citation', `[${s.n}]`],
    ['Chunk id', s.chunk_id],
    ['Book id', s.book_id],
  ];
  $('#pmeta').innerHTML = rows
    .map(([k, v]) => `<dt>${k}</dt><dd>${esc(String(v))}</dd>`).join('');
  // textContent, not innerHTML: this is the ORIGINAL markdown, shown verbatim.
  $('#praw').textContent = s.content;

  // The real thing: the PDF itself, opened at the passage's first page. The
  // endpoint redirects to storage or serves a local copy; the #page fragment
  // is client-side and survives the redirect.
  const pdf = $('#ppdf');
  if (s.book_id != null && s.page_start != null) {
    pdf.href = `/api/books/${s.book_id}/pdf#page=${s.page_start}`;
    pdf.textContent = `Open the PDF at p.${s.page_start} ↗`;
    pdf.hidden = false;
  } else {
    pdf.hidden = true;
  }
  $('#panel').classList.add('show');
}

function hidePanel() {
  $('#panel').classList.remove('show');
  document.querySelectorAll('.answer cite.on').forEach(c => c.classList.remove('on'));
}

$('#pclose').addEventListener('click', hidePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePanel(); });
document.addEventListener('click', e => {
  const cite = e.target.closest('.answer cite');
  if (cite) { showSource(cite.dataset.t, cite.dataset.n); e.stopPropagation(); return; }
  if (!e.target.closest('#panel')) hidePanel();
});

const citeify = (text, ti) => md(text, html =>
  html.replace(/\[(\d+)\]/g, (m, n) => (TURNS[ti] || {})[n]
    ? `<cite data-t="${ti}" data-n="${n}" title="${esc(TURNS[ti][n].book)} — ${esc(TURNS[ti][n].pages)}">${n}</cite>`
    : m));

// ---- The conversation ----
const scrollDown = () => { const m = $('#msgs'); m.scrollTop = m.scrollHeight; };

function addTurn(question) {
  const ti = TURNS.length;
  TURNS.push({});
  $('#hello')?.remove();
  $('#msgs').insertAdjacentHTML('beforeend',
    `<div class="turn" id="turn-${ti}">
       <div class="msg user">${esc(question)}</div>
       <div class="msg bot">
         <details class="trace"><summary id="tsum-${ti}">Researching…</summary>
           <div class="trace-body" id="trace-${ti}"></div>
         </details>
         <div class="answer" id="ans-${ti}"></div>
       </div>
     </div>`);
  scrollDown();
  return ti;
}

$('#ex').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') { $('#q').value = e.target.textContent; $('#f').requestSubmit(); }
});

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const question = $('#q').value.trim();
  if (!question) return;
  $('#q').value = '';
  $('#go').disabled = true;

  const ti = addTurn(question);
  const steps = [];
  const trace = $(`#trace-${ti}`), sum = $(`#tsum-${ti}`), ans = $(`#ans-${ti}`);
  const paintTrace = () => { trace.innerHTML = steps.map(s => s.html).join(''); scrollDown(); };
  let searches = 0;
  steps.push({ html: `<div class="step status loading"><span class="lbl">start</span>thinking…</div>` });
  paintTrace();

  try {
    const r = await fetch('/api/research', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question })
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    let rawAnswer = '';
    steps.length = 0;

    // `terminal: 'done'` is what turns a dropped connection into an error. A
    // stream that just stops leaves the trail half-drawn and the page silent.
    await readEventStream(r, ev => {
      if (ev.type === 'thinking') {
        steps.push({ html: `<div class="step"><span class="lbl">reasoning</span><span class="think">${esc(ev.text)}</span></div>` });
      } else if (ev.type === 'search') {
        if (ev.query) searches++;
        sum.textContent = `Researching… ${searches} search${searches === 1 ? '' : 'es'}`;
        steps.push({ html: ev.query
          ? `<div class="step"><span class="lbl">search</span><span class="q">“${esc(ev.query)}”</span>${ev.book_id ? ` <span class="badge">book ${ev.book_id}</span>` : ''}</div>`
          : `<div class="step"><span class="lbl">tool</span><span class="q">list_books</span></div>` });
      } else if (ev.type === 'results') {
        const last = steps[steps.length - 1];
        last.html += `<div class="hits">${ev.hits.map(h =>
          `<div class="${h.weak ? 'w' : ''}"><b>[${h.n}]</b> d=${h.distance} · ${esc(h.book).slice(0,40)} ${h.pages}${h.heading ? ' · ' + esc(h.heading).slice(0,54) : ''}</div>`
        ).join('')}${ev.strong === 0 ? '<div class="w">— no strong matches; agent should rephrase</div>' : ''}</div>`;
      } else if (ev.type === 'answer') {
        rawAnswer = ev.text;
      } else if (ev.type === 'done') {
        TURNS[ti] = Object.fromEntries(ev.sources.map(s => [String(s.n), s]));
        ans.innerHTML = citeify(rawAnswer, ti);
        sum.textContent = `Researched · ${searches} search${searches === 1 ? '' : 'es'} · ${ev.sources.length} sources`;
      } else if (ev.type === 'error') {
        throw new Error(ev.message);
      }
      paintTrace();
    }, {
      terminal: 'done',
      // Not a timeout -- a hard question legitimately runs for a minute, and
      // killing one that is merely slow is worse than waiting. This only
      // changes what the user is told.
      onStall: secs => {
        steps.push({ html: `<div class="step status warn"><span class="lbl">waiting</span>` +
          `no update for ${secs}s — still connected, but the model may be stuck.</div>` });
        paintTrace();
      },
    });
  } catch (err) {
    sum.textContent = 'Research failed';
    ans.innerHTML = `<p class="err">${esc(String(err.message || err))}</p>`;
    scrollDown();
  } finally {
    $('#go').disabled = false;
    $('#q').focus();
  }
});

refreshBooks();
</script>
</body>
</html>
