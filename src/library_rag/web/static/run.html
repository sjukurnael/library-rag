    <div class="sideauth" id="sideauth" hidden></div>

  </aside>

  <div class="page">
    <div class="pagebody runbody">
      <a class="backlink" href="/runs">← Activity</a>

  </div>
</div>

<div class="cardwrap" id="cardwrap" hidden>
  <div class="cardback" id="cardback"></div>
  <aside class="bookcard" role="dialog" aria-modal="true" aria-labelledby="cardtitle">
    <div class="bchead">
      <h2 id="cardtitle"></h2>
      <button class="bcx" id="cardclose" title="Close">&times;</button>
    </div>
    <div class="bcbody" id="cardbody"></div>
  </aside>
</div>

<script src="/static/app.js"></script>
<script>
const RUN_ID = decodeURIComponent(location.pathname.split('/').pop());

/* The classroom's CURRENT membership. Set once per load from the API rather
   than derived from the run, so "User action" reflects what the reader has
   actually done since -- including books they added that the librarian never
   recommended, and ones they have since taken off. */
let SHELF = new Set();
let HAS_SHELF = false;
let NANGLES = 0;

const MODEL_LABEL = { 'claude-sonnet-5': 'Sonnet', 'claude-opus-5': 'Opus' };
const PRICE = { 'claude-sonnet-5': [2, 10], 'claude-opus-5': [5, 25] };

function costOf(r) {
  const p = PRICE[r.model];
  if (!p || !r.input_tokens) return null;
  const [i, o] = p;
  return ((r.input_tokens * i) + (r.output_tokens * o)
        + ((r.cache_write_tokens || 0) * i * 1.25)
        + ((r.cache_read_tokens || 0) * i * 0.10)) / 1e6;
}

function duration(secs) {
  if (secs == null) return null;
  const s = Math.round(secs);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
}

/* A cosine distance is not a thing to show a reader. 0.19 means nothing on its
   own, and the numbers that matter here live in a narrow band -- measured runs
   sit between 0.19 and 0.36, and PROFILE_RELEVANCE_FLOOR calls 0.50 the point
   past which a match is not really a match. So it becomes a word and four bars,
   with the raw figure on hover for whoever wants it. */
function strength(d) {
  if (d == null)  return { label: 'unknown', n: 0 };
  if (d < 0.25)   return { label: 'Strong',  n: 4 };
  if (d < 0.35)   return { label: 'Good',    n: 3 };
  if (d < 0.50)   return { label: 'Fair',    n: 2 };
  return            { label: 'Weak',    n: 1 };
}

function bars(d) {
  const s = strength(d);
  const pips = [1, 2, 3, 4]
    .map(i => `<i class="${i <= s.n ? 'on' : ''}"></i>`).join('');
  const raw = d == null ? '' : ` (cosine distance ${d})`;
  return `<span class="stren s${s.n}" title="${esc(s.label)}${esc(raw)}">
            <span class="pips">${pips}</span><span class="slab">${s.label}</span></span>`;
}

/* ------------------------------------------------- reading the event log -- */

/* One run's events into the three things worth showing: what it searched for,
   every book those searches surfaced, and what became of each one.

   The union is the point. Eight searches return twelve books each, so "80
   books" is a DEDUPED count and no single ranking of eighty exists -- a book
   can be second for one angle and fortieth for another. Each book therefore
   keeps its best distance, and a count of how many angles found it at all,
   which is its own quality signal: three independent searches agreeing is
   worth more than one strong hit. */
function digest(events) {
  const angles = [];
  const opened = new Map();     // book_id -> {passages, nearest, question}
  const books  = new Map();     // book_id -> union record
  let shelved = [], answer = '', usage = null, pendingTopic = null, pendingAsk = null;

  for (const { payload: e } of events) {
    if (e.type === 'tool' && e.name === 'find_books') {
      pendingTopic = (e.input && e.input.topic) || null;
    } else if (e.type === 'tool' && e.name === 'look_inside') {
      // The question it chose to ask this book -- the clearest statement
      // anywhere of WHY it opened this one. Held until the result arrives,
      // which is the event carrying the book_id.
      pendingAsk = (e.input && e.input.question) || null;
    } else if (e.type === 'results' && e.name === 'find_books') {
      const s = e.summary || {};
      const angle = {
        topic: s.topic || pendingTopic || '(no topic recorded)',
        thin: !!s.thin,
        nearest: s.nearest,
        candidates: s.candidates || [],
      };
      angles.push(angle);
      const angleNo = angles.length;
      angle.candidates.forEach((c, i) => {
        if (c.book_id == null) return;
        const rank = i + 1;
        // Every appearance is kept, not just the best one. A book found by four
        // angles has four different ranks, distances and matched labels, and
        // the card shows all of them -- that spread IS the evidence.
        const hit = { angle: angleNo, topic: angle.topic, rank,
                      distance: c.distance, covers: c.covers };
        const prev = books.get(c.book_id);
        if (!prev) {
          books.set(c.book_id, { ...c, best: c.distance, hits: [hit] });
        } else {
          prev.hits.push(hit);
          if (c.distance != null && (prev.best == null || c.distance < prev.best)) {
            prev.best = c.distance;
            prev.covers = c.covers;      // the label from its STRONGEST angle
          }
        }
      });
    } else if (e.type === 'results' && e.name === 'look_inside') {
      const s = e.summary || {};
      if (s.book_id != null) {
        opened.set(s.book_id, { passages: s.passages || 0, nearest: s.nearest,
                                question: pendingAsk });
      }
      pendingAsk = null;
    } else if (e.type === 'recommendations') {
      shelved = e.books || [];
    } else if (e.type === 'answer') {
      answer = e.text || '';
    } else if (e.type === 'done') {
      usage = e.usage || null;
    }
  }

  const byId = new Map(shelved.filter(b => b.book_id != null).map(b => [b.book_id, b]));
  const considered = [...books.values()].map(b => ({
    ...b,
    hits: b.hits.sort((x, y) => (x.distance ?? 9) - (y.distance ?? 9)),
    opened: opened.has(b.book_id),
    read: opened.get(b.book_id) || null,
    recommended: byId.has(b.book_id),
    pick: byId.get(b.book_id) || null,
    onShelf: SHELF.has(b.book_id),
  })).sort((a, b) => (a.best ?? 9) - (b.best ?? 9));

  return { angles, considered, opened, shelved, answer, usage };
}

/* --------------------------------------------------------------- render -- */

/* What the LIBRARIAN did. History: this cannot change, whatever anyone does to
   the shelf afterwards. "Recommended" means it put the book on its shortlist,
   which is a proposal -- the reader is the one who shelves anything. */
function didWhat(b) {
  if (b.recommended) return '<span class="fate picked">Recommended</span>';
  if (b.opened)      return '<span class="fate opened">Read, not recommended</span>';
  return '<span class="fate seen">Not opened</span>';
}

/* What the READER did, read live from the classroom rather than from the run.
   Add a book and this says so on the next load; remove it and it stops saying
   so. Blank when the run was not tied to a classroom at all, which is honest --
   there was no shelf for anything to be added to. */
function userDid(b, hasShelf) {
  if (!hasShelf)  return '<span class="dim">—</span>';
  if (b.onShelf)  return '<span class="fate shelved">Added to shelf</span>';
  return '<span class="dim">—</span>';
}

function bookRow(b, rank) {
  return `<tr class="clicky" data-book="${b.book_id}" tabindex="0">
      <td class="rank">${rank}</td>
      <td class="bt">${esc(b.title || '(untitled)')}
        ${b.pages ? `<span class="bp">${b.pages} pages</span>` : ''}</td>
      <td class="cv" title="${esc(b.covers || '')}"><span class="cvt">${
        b.covers ? esc(b.covers) : '<span class="dim">—</span>'}</span></td>
      <td class="st">${bars(b.best ?? b.distance)}</td>
      <td class="ag">${b.hits.map(h =>
          `<span class="anum sm" title="${esc(h.topic)} — ranked #${h.rank} here">${h.angle}</span>`
        ).join('')}</td>
      <td class="ft">${didWhat(b)}</td>
      <td class="ft">${userDid(b, HAS_SHELF)}</td>
    </tr>`;
}

function consideredTable(considered) {
  // Its own horizontal scroller: seven columns and 1000-page book titles will
  // outgrow a narrow window, and the page body must never scroll sideways.
  return `<div class="tablewrap"><table class="runtable">
      <thead><tr>
        <th class="rank" title="Position after combining every angle — not a rank the search produced">#</th>
        <th>Book</th><th>Matched on</th>
        <th>Match</th><th title="How many of the searches found this book">Angles</th>
        <th>Librarian</th><th>User action</th>
      </tr></thead>
      <tbody>${considered.map((b, i) => bookRow(b, i + 1)).join('')}</tbody>
    </table></div>`;
}

function angleCard(a, i, openedIds, shelvedIds) {  // shelvedIds = recommended
  const rows = a.candidates.map((c, j) => {
    const b = { ...c, opened: openedIds.has(c.book_id),
                recommended: shelvedIds.has(c.book_id),
                onShelf: SHELF.has(c.book_id) };
    return `<tr>
        <td class="rank">${j + 1}</td>
        <td class="bt">${esc(c.title || '(untitled)')}</td>
        <td class="cv" title="${esc(c.covers || '')}"><span class="cvt">${
          c.covers ? esc(c.covers) : '<span class="dim">—</span>'}</span></td>
        <td class="st">${bars(c.distance)}</td>
        <td class="ft">${didWhat(b)}</td>
        <td class="ft">${userDid(b, HAS_SHELF)}</td>
      </tr>`;
  }).join('');

  return `<details class="angle"${i === 0 ? ' open' : ''}>
      <summary>
        <span class="anum">${i + 1}</span>
        <span class="atopic">${esc(a.topic)}</span>
        <span class="ameta">${a.candidates.length} books${
          a.thin ? ' · <span class="thin">library is thin here</span>' : ''}</span>
      </summary>
      <div class="tablewrap inner"><table class="runtable">
        <thead><tr>
          <th class="rank" title="Rank within this angle — this one IS the search's own order">#</th>
          <th>Book</th><th>Matched on</th>
          <th>Match</th><th>Librarian</th><th>User action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </details>`;
}

function funnel(d) {
  const steps = [
    [d.angles.length, 'angles searched'],
    [d.considered.length, 'books considered'],
    [d.opened.size, 'opened and read'],
    [d.shelved.length, 'recommended'],
  ];
  return `<div class="funnel">${steps.map(([n, label], i) =>
    `<div class="fstep"><span class="fn">${n}</span><span class="fl">${label}</span></div>` +
    (i < steps.length - 1 ? '<span class="farrow">→</span>' : '')
  ).join('')}</div>`;
}

function header(run, classroom, d) {
  const bits = [];
  if (run.owner_email) bits.push(`<span class="who" title="${esc(run.owner_email)}">${
    esc(String(run.owner_email).split('@')[0])}</span>`);
  if (classroom) bits.push(`<a href="/classroom/${classroom.id}">${esc(classroom.name)}</a>`);
  if (run.model) bits.push(esc(MODEL_LABEL[run.model] || run.model));
  const dur = duration(run.seconds != null ? run.seconds
    : (run.finished_at ? (new Date(run.finished_at) - new Date(run.started_at)) / 1000 : null));
  if (dur) bits.push(dur);
  const c = costOf(run);
  if (c != null) bits.push(c < 0.01 ? '<$0.01' : '$' + c.toFixed(2));
  if (run.iterations) bits.push(`${run.iterations} turns`);

  const badge = run.status === 'done' ? '' :
    `<span class="rstat ${esc(run.status)}">${esc(run.status)}</span>`;

  return `<div class="runhead">
      <div class="rkind">${run.agent === 'librarian' ? 'Librarian' : 'Tutor'}${badge}</div>
      <h1>${esc(run.question || '(no brief)')}</h1>
      <div class="rbits">${bits.join(' <span class="sep">·</span> ')}</div>
    </div>
    ${run.error ? `<div class="banner bad">${esc(run.error)}</div>` : ''}`;
}

function render(data) {
  const { run, classroom } = data;
  SHELF = new Set(data.on_shelf || []);
  HAS_SHELF = !!classroom;
  const d = digest(data.events || []);
  const openedIds = new Set(d.opened.keys());
  const recIds = new Set(d.shelved.map(b => b.book_id).filter(x => x != null));

  let html = header(run, classroom, d);

  if (run.agent !== 'librarian') {
    // The tutor's runs are a different shape -- searches inside a fixed shelf,
    // not a search FOR a shelf -- so this page shows what it has rather than
    // pretending the librarian's structure fits.
    html += `<div class="sect"><h2>Answer</h2>
      <div class="ranswer">${esc(run.answer || '(no answer recorded)')}</div></div>`;
    $('#run').innerHTML = html;
    return;
  }

  html += funnel(d);

  html += `<div class="sect">
      <h2>Books considered <span class="count">${d.considered.length}</span></h2>
      <p class="say">Every book the searches surfaced, ordered by its best match
        across all ${d.angles.length} angles. There is no single ranking of
        ${d.considered.length} — each angle ranks its own twelve — so a book's
        place here is the best it managed anywhere, and <b>Angles</b> says how
        many searches found it at all.</p>
      ${d.considered.length ? consideredTable(d.considered)
                            : '<div class="empty">No candidates recorded.</div>'}
    </div>`;

  html += `<div class="sect">
      <h2>What it searched for <span class="count">${d.angles.length}</span></h2>
      <p class="say">Each angle is a separate search, in the librarian's own
        words. These are what it decided were the useful ways in.</p>
      ${d.angles.map((a, i) => angleCard(a, i, openedIds, recIds)).join('')}
    </div>`;

  if (d.shelved.length) {
    html += `<div class="sect">
        <h2>Recommended <span class="count">${d.shelved.length}</span></h2>
        ${d.shelved.map(b => `<div class="shelf1">
            <div class="s1t">${esc(b.title || '(untitled)')}</div>
            ${b.why ? `<div class="s1w">${esc(b.why)}</div>` : ''}
            ${b.passage ? `<div class="s1q">“${esc(b.passage)}”${
              b.passage_pages ? `<span class="s1p">${esc(b.passage_pages)}</span>` : ''
            }</div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  if (d.answer) {
    html += `<div class="sect"><h2>Closing note</h2>
      <div class="ranswer">${esc(d.answer)}</div></div>`;
  }

  $('#run').innerHTML = html;

  CARDS = new Map(d.considered.map(b => [b.book_id, b]));
  NANGLES = d.angles.length;
  $('#run').querySelectorAll('tr.clicky').forEach(tr => {
    tr.addEventListener('click', () => openCard(tr.dataset.book));
    tr.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(tr.dataset.book); }
    });
  });
}

/* ------------------------------------------------------------ book card -- */

/* One book, in full. A row fits seven columns; this does not, so everything
   that cannot be scanned at a glance lives here -- every angle that found it
   with its own rank and label, the question the librarian put to it, and what
   came back.

   A slide-over rather than a modal: the table stays visible behind it, so
   moving between books does not feel like leaving the run. */
let CARDS = new Map();

function angleLine(h) {
  return `<li>
      <div class="alh"><span class="anum sm">${h.angle}</span>
        <span class="alt">${esc(h.topic)}</span></div>
      <div class="alm">ranked <b>#${h.rank}</b> here${
        h.distance != null ? ' · ' + bars(h.distance) : ''}</div>
      ${h.covers ? `<div class="alc">matched on <span>${esc(h.covers)}</span></div>` : ''}
    </li>`;
}

function openCard(bookId) {
  const b = CARDS.get(Number(bookId));
  if (!b) return;
  const src = `/api/books/${b.book_id}/source`;
  const page = b.pick && b.pick.passage_page ? `?page=${b.pick.passage_page}` : '';

  $('#cardbody').innerHTML = `
    <dl class="bcstats">
      <dt>Best match</dt><dd>${bars(b.best)}</dd>
      <dt>Found by</dt><dd><b>${b.hits.length}</b> of ${NANGLES} angles</dd>
      ${b.pages ? `<dt>Length</dt><dd><b>${b.pages}</b> pages</dd>` : ''}
    </dl>
    <div class="bcchips">${didWhat(b)}${
      HAS_SHELF ? ' ' + userDid(b, true) : ''}</div>

    <h3>Where it matched</h3>
    <ul class="alist">${b.hits.map(angleLine).join('')}</ul>

    ${b.read ? `<h3>What the librarian asked it</h3>
      <div class="bcask">${b.read.question ? '“' + esc(b.read.question) + '”'
        : '<span class="dim">not recorded</span>'}</div>
      <div class="bcmeta">${b.read.passages} passage(s) came back${
        b.read.nearest != null ? ' · closest ' + b.read.nearest : ''}</div>` : ''}

    ${b.pick ? `<h3>Why it was recommended</h3>
      ${b.pick.why ? `<div class="bcwhy">${esc(b.pick.why)}</div>` : ''}
      ${b.pick.passage ? `<div class="bcq">“${esc(b.pick.passage)}”${
        b.pick.passage_pages ? `<span class="bcp">${esc(b.pick.passage_pages)}</span>` : ''
      }</div>` : ''}` : ''}

    <a class="bcopen" href="${esc(src + page)}" target="_blank" rel="noopener">
      Open the PDF in Drive ↗</a>`;
  $('#cardtitle').textContent = b.title || '(untitled)';
  $('#cardwrap').hidden = false;
}

function closeCard() { $('#cardwrap').hidden = true; }

async function load() {
  try {
    const r = await fetch('/api/runs/' + encodeURIComponent(RUN_ID));
    if (!r.ok) throw new Error(r.status === 404 ? 'No such run.' : r.statusText);
    render(await r.json());
  } catch (err) {
    $('#run').innerHTML = failed('Could not load this run', err, load);
  }
}

$('#cardclose').addEventListener('click', closeCard);
$('#cardback').addEventListener('click', closeCard);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

paintAuth();
paintLibraryFoot();
load();
</script>
</body>
</html>
