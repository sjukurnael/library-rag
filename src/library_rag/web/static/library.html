<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — drive</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand"><span class="logo"></span>Library</div>
    <nav class="snav">
      <a href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat</a>
      <a href="/library" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Drive</a>
      <a href="/queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Processing</a>
    </nav>
    <div class="sidebooks">
      <button class="sidehead" id="bookstoggle" aria-expanded="false">
        <span class="chev">▸</span> In the index
        <span class="count" id="bookcount"></span>
      </button>
      <ul id="navbooks" hidden></ul>
    </div>
    <div class="sideauth" id="sideauth" hidden></div>
    <div class="sidefoot" id="sidefoot">loading…</div>
  </aside>

  <div class="page">
    <div class="pagehead">
      <h1>Drive</h1>
      <span class="sub" id="stat">loading…</span>
      <span style="flex:1"></span>
      <!-- The librarian is a different feature from search, not a variant of
           it: search runs the one query you typed, the librarian runs an agent
           that writes its own. It sits up here with the page's other top-level
           action (cf. queue.html's Upload) rather than in the toolbar, where
           being adjacent to the search box implied it modified the search. -->
      <button class="btn" id="librarianbtn">✦ Ask the librarian</button>
    </div>
    <div class="pagebody">

      <div class="banner" id="authbanner" hidden>
        <span class="msg" id="amsg"></span>
        <button class="btn" id="connect">Connect Google Drive</button>
      </div>

      <div class="banner" id="banner" hidden>
        <span class="msg" id="bmsg"></span>
        <button class="btn" id="sync">Sync from Drive</button>
      </div>

      <div class="card librarian" id="librarian" hidden>
        <form class="ask" id="bf">
          <input type="text" id="bq" autocomplete="off" class="li-input"
                 placeholder="What do you want to study? e.g. the parables, church history…"
                 style="flex:1;border:0;background:var(--panel);border-radius:999px;padding:10px 18px;color:var(--ink);font:inherit;outline:none">
          <button type="submit" class="btn primary" id="bgo">Browse</button>
        </form>
        <div class="sub" style="margin-top:8px">
          An agent searches the whole drive by meaning and shortlists books worth
          indexing next. Books you already have are excluded.
        </div>
        <div id="btrail"></div>
        <div id="bout"></div>
      </div>

      <div class="toolbar">
        <form class="searchpill" id="sf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="sq" autocomplete="off"
                 placeholder="Search 57,000 books by meaning — “the end times”, “how to pray”, “Paul in prison”…">
        </form>
        <!-- form= submits #sf from outside it, so this button and the Enter key
             go through the one submit handler rather than two code paths. -->
        <button class="btn primary" id="searchbtn" type="submit" form="sf">Search</button>
      </div>

      <div class="split">
        <div class="tree" id="tree">loading…</div>
        <div>
          <div class="crumb" id="crumb"></div>
          <!-- Explanations that must not cost you the breadcrumb: the error
               path used to overwrite #crumb, which answered the question and
               took away the navigation you needed to act on the answer. -->
          <div class="note" id="note" hidden></div>
          <div class="files" id="files"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<script src="/static/app.js"></script>
<script>
let current = null;          // folder id being viewed, null = roots
let searching = false;
let pollTimer = null;

const FOLDER_ICON = '<svg class="ic-folder" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
const PDF_ICON = '<svg class="ic-pdf" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>';

// ---------------------------------------------------------------- status --

async function refreshStatus() {
  let s;
  try {
    s = await fetchJSON('/api/drive/sync/progress', {}, 15000);
  } catch (err) {
    $('#stat').textContent = 'server unreachable';
    return {};
  }
  $('#stat').textContent = s.files
    ? `${s.files.toLocaleString()} PDFs · ${s.folders.toLocaleString()} folders · ` +
      `${s.embedded.toLocaleString()} searchable`
    : 'mirror is empty';
  // The banner appears only when there is something to act on: an empty mirror,
  // titles still unembedded (so search is partial), or a sync in flight.
  const need = !s.files || s.pending > 0 || s.running;
  $('#banner').hidden = !need;
  if (need) {
    $('#bmsg').textContent = s.running
      ? `Syncing… ${s.message || ''}`
      : !s.files
        ? 'No Drive metadata yet. Sync to browse and search the whole library.'
        : `${s.pending.toLocaleString()} title(s) not yet searchable by meaning.`;
    $('#sync').disabled = !!s.running;
  }
  if (s.running) setTimeout(refreshStatus, 2000);
  return s;
}

// Drive access is checked on load and after every failed action, so an expired
// token shows as a banner you can act on rather than a 503 you have to decode.
// Only ADDING a book needs Drive -- browsing and searching run off the local
// mirror -- so this must not block the page.
// True while a consent flow is in flight. The poller must not repaint #amsg
// while it is, or it overwrites the sign-in link every 3 seconds -- the link
// would appear and vanish faster than anyone could click it.
let connecting = false;

async function refreshAuth() {
  let a;
  try { a = await fetchJSON('/api/drive/auth/status', {}, 15000); }
  catch { return; }
  $('#authbanner').hidden = a.ok;
  if (!a.ok && !connecting) {
    $('#amsg').textContent = {
      not_connected: 'Not connected to Google Drive yet. Browsing works; indexing a book needs access.',
      revoked: 'Google access expired. Reconnect to index new books — your library is unaffected.',
      no_refresh_token: 'Google access cannot be renewed. Reconnect to index new books.',
      unreadable: 'The stored Google credentials are unreadable. Reconnect.',
      missing_client: a.detail,
    }[a.reason] || a.detail || 'Google Drive is not available.';
    $('#connect').hidden = a.reason === 'missing_client';
  }
  return a;
}

$('#connect').addEventListener('click', async () => {
  // Opened SYNCHRONOUSLY, before any await. A window.open() that runs after an
  // await has lost its user-gesture context, and popup blockers suppress it
  // with no error and no console warning -- which is exactly how this button
  // came to do nothing at all while the server happily issued consent URLs.
  //
  // Also deliberately WITHOUT 'noopener': that makes window.open return null by
  // spec, leaving no handle to point at the URL once we have it. The target is
  // accounts.google.com, so the opener reference it gains is acceptable.
  const tab = window.open('', '_blank');
  connecting = true;
  $('#connect').disabled = true;
  try {
    const d = await fetchJSON('/api/drive/auth/start', {}, 15000);
    if (tab && !tab.closed) tab.location = d.url;

    // Always offer the link too. If the popup was blocked anyway, or the user
    // closed the tab, this is the difference between "press it again and hope"
    // and a thing they can click. Its click IS a fresh gesture, so it always
    // navigates.
    $('#amsg').innerHTML =
      (tab ? 'Approve access in the new tab, then come back — this page checks every few seconds. '
           : 'Your browser blocked the new tab. ') +
      `<a href="${esc(d.url)}" target="_blank" rel="noopener">Open the Google sign-in page</a>`;

    // Poll rather than ask the user to refresh: the callback lands in the OTHER
    // tab, so this one has no other way to learn it succeeded.
    const started = Date.now();
    const poll = setInterval(async () => {
      const a = await refreshAuth();
      if ((a && a.ok) || Date.now() - started > 300000) {
        clearInterval(poll);
        connecting = false;
        $('#connect').disabled = false;
        if (a && a.ok) refreshStatus();
      }
    }, 3000);
  } catch (err) {
    if (tab && !tab.closed) tab.close();
    connecting = false;
    $('#connect').disabled = false;
    $('#amsg').textContent = `Could not start sign-in — ${err.message || err}`;
  }
});

$('#sync').addEventListener('click', async () => {
  $('#sync').disabled = true;
  await fetch('/api/drive/sync', { method: 'POST' });
  refreshStatus();
});

// ------------------------------------------------------------------ tree --

async function children(parent) {
  const u = parent ? `/api/drive/children?parent=${encodeURIComponent(parent)}`
                   : '/api/drive/children';
  // 15s, not 30: this is one indexed SQL lookup. Anything approaching a second
  // means the mirror is missing its index or the database is gone, and waiting
  // half a minute to say so helps nobody.
  return fetchJSON(u, {}, 15000);
}

function folderRow(f) {
  return `<li data-id="${esc(f.file_id)}">` +
    `<div class="row"><span class="tw">▶</span>` +
    `<span class="nm" title="${esc(f.title)}">${esc(f.title)}</span></div></li>`;
}

async function buildTree() {
  const p = progress($('#tree'), { label: 'Loading the library', normal: 4 });
  try {
    const d = await children(null);
    p.stop();
    $('#tree').innerHTML = d.folders.length
      ? `<ul>${d.folders.map(folderRow).join('')}</ul>`
      : '<span class="empty">Nothing mirrored yet — press Sync from Drive above.</span>';
    open(null, d);
  } catch (err) {
    p.stop();
    failed($('#tree'), `Could not load the library — ${err.message || err}`, buildTree);
  }
}

// Lazy: a folder's children are fetched the first time it is expanded. Eagerly
// building 8,000+ nodes would be one enormous query to render a view where all
// but a handful of rows are collapsed.
$('#tree').addEventListener('click', async e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const li = row.parentElement;
  const id = li.dataset.id;
  document.querySelectorAll('.tree .row.on').forEach(r => r.classList.remove('on'));
  row.classList.add('on');

  let sub = li.querySelector('ul');
  if (sub) {
    const showing = sub.hidden = !sub.hidden;
    row.querySelector('.tw').textContent = showing ? '▶' : '▼';
  } else {
    const d = await children(id);
    if (d.folders.length) {
      li.insertAdjacentHTML('beforeend', `<ul>${d.folders.map(folderRow).join('')}</ul>`);
      row.querySelector('.tw').textContent = '▼';
    } else {
      row.querySelector('.tw').textContent = '·';
    }
    open(id, d);
    return;
  }
  open(id);
});

// ------------------------------------------------------------------ files --

function statusCell(f, i) {
  const has = f.indexed;
  const working = has && !TERMINAL.has(f.status) && f.status !== 'done';
  if (working) return `<span class="badge work">${esc(STAGE[f.status] || f.status)}…</span>`;
  if (has && f.status === 'done') return `<span class="badge good">In your library</span>`;
  if (has) return `<span class="badge bad">${esc(f.status)}</span>`;
  return `<button class="btn ix" data-i="${i}">Index</button>`;
}

// A Drive-style row: icon + name, location, size, then the status or action.
function fileRow(f, i) {
  const where = f.path ? f.path.split(' / ').slice(0, -1).join(' / ') : '';
  return `<div class="frow">` +
    `<div class="fname">${PDF_ICON}<span class="t" title="${esc(f.title)}">${esc(f.title)}</span></div>` +
    `<div class="fwhere" title="${esc(where)}">${esc(where)}` +
    `${where ? ' · ' : ''}<a href="${esc(f.url)}" target="_blank" rel="noopener">Drive</a></div>` +
    `<div class="fsize">${esc(mb(f.size_mb))}</div>` +
    `<div class="fact">${statusCell(f, i)}</div></div>`;
}

// "Index folder" queues the folder's whole subtree, so it is gated by size.
// Over the limit the button stays LIVE and explains itself on click, rather
// than sitting greyed out: a dead control says you cannot, never why, and the
// why is the half that tells you what to do instead. Hover text is not an
// answer either -- it does not exist on touch, and nobody hovers a button they
// have already been told is dead. The server enforces the same limit (413),
// so this is a shortcut to the explanation, not the guard itself.
function dirBtn(f, label) {
  const over = LIMIT_MB != null && f.size_mb != null && f.size_mb > LIMIT_MB;
  return `<button class="btn ixdir" data-dir="${esc(f.file_id)}"` +
    (over ? ` data-over="${esc(mb(f.size_mb))}" data-name="${esc(f.title)}"` : '') +
    ` title="${over ? 'Too large to index in one action — click to see why'
                    : 'Queue every PDF in this folder for indexing'}">${esc(label)}</button>`;
}

// Why one folder can be indexed whole and another cannot, in the terms the
// question is actually asked in: this folder, its size, the ceiling, and the
// two ways through.
function overLimitNote(subject, size, remedy) {
  return `${subject} ${size} of PDFs — more than the ${LIMIT_MB} MB that one bulk ` +
    `action can queue. ${remedy}`;
}

// A message that does not cost you the breadcrumb (see #note in the markup).
function note(message) {
  const el = $('#note');
  el.textContent = message;
  el.hidden = false;
}

function dirRow(f) {
  return `<div class="frow isfolder" data-open="${esc(f.file_id)}">` +
    `<div class="fname">${FOLDER_ICON}<span class="t" title="${esc(f.title)}">${esc(f.title)}</span></div>` +
    `<div class="fwhere"></div><div class="fsize">${esc(mb(f.size_mb))}</div>` +
    `<div class="fact">${dirBtn(f, 'Index folder')}</div></div>`;
}

let shown = [];
let LIMIT_MB = null;   // the bulk-index ceiling, told to us by the children API

function render(d, crumb) {
  shown = d.files;
  if (d.folder_limit_mb != null) LIMIT_MB = d.folder_limit_mb;
  // A note explains the view you were in; moving somewhere else retires it.
  $('#note').hidden = true;
  $('#crumb').innerHTML = crumb === undefined ? $('#crumb').innerHTML
    : (crumb.length
        ? '<a href="#" data-id="">All</a>' +
          crumb.slice(0, -1).map(c =>
            `<span class="sep">›</span><a href="#" data-id="${esc(c.file_id)}">${esc(c.name)}</a>`).join('') +
          `<span class="sep">›</span><span class="here">${esc(crumb[crumb.length - 1].name)}</span>` +
          // The folder being LOOKED AT has no row of its own, so its
          // index-everything button lives on the trail instead.
          (d.folder ? dirBtn(d.folder, 'Index all here') : '')
        : '<span class="here">All folders</span>');
  const folders = d.folders || [];
  const head = (folders.length || d.files.length)
    ? `<div class="fhead"><div>Name</div><div class="fwhere">Location</div><div>Size</div><div></div></div>`
    : '';
  $('#files').innerHTML = head +
    folders.map(dirRow).join('') +
    (d.files.length
      ? d.files.map(fileRow).join('')
      : (folders.length ? '' :
         '<div class="empty">No PDFs in this folder — open a subfolder on the left.</div>'));

  // Poll only while something is genuinely mid-pipeline, for the same reason
  // the queue page does: a finished or failed book never changes on its own.
  clearTimeout(pollTimer);
  if (d.files.some(f => f.indexed && f.status !== 'done' && !TERMINAL.has(f.status))) {
    pollTimer = setTimeout(() => searching ? null : open(current), 3000);
  }
}

async function open(id, prefetched) {
  searching = false;
  current = id;
  if (prefetched) return render(prefetched, prefetched.breadcrumb || []);
  const p = progress($('#files'), { label: 'Opening folder', normal: 3 });
  try {
    const d = await children(id);
    p.stop();
    render(d, d.breadcrumb || []);
  } catch (err) {
    p.stop();
    failed($('#files'), `Could not open that folder — ${err.message || err}`,
           () => open(id));
  }
}

$('#crumb').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  open(a.dataset.id || null);
});

// Folder rows in the main pane open like Drive's do -- unless the click was
// the row's own Index-folder button, which queues rather than navigates.
$('#files').addEventListener('click', e => {
  if (e.target.closest('.ixdir')) return;
  const dir = e.target.closest('.frow.isfolder');
  if (dir) open(dir.dataset.open);
});

// ----------------------------------------------------------- index folder --

// One handler, two homes: folder rows live in #files, the current folder's
// "Index all here" lives on the breadcrumb.
async function queueFolder(btn) {
  btn.disabled = true;
  btn.textContent = 'Queueing…';
  try {
    const d = await fetchJSON(`/api/drive/folders/${encodeURIComponent(btn.dataset.dir)}/index`,
                              { method: 'POST' }, 30000);
    btn.textContent = d.queued ? `Queued ${d.queued}` : 'Already yours';
    refreshBooks();
    // Give the "Queued N" a moment to be read, then re-render so any of the
    // queued files visible in this view pick up their working badges.
    if (d.queued && !searching) setTimeout(() => open(current), 2500);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Index folder';
    failed($('#crumb'), `Could not queue that folder — ${err.message || err}`, null);
  }
}

for (const host of [$('#files'), $('#crumb')]) {
  host.addEventListener('click', e => {
    const btn = e.target.closest('.ixdir');
    if (!btn || btn.disabled || !btn.dataset.dir) return;
    // Over the ceiling the click buys the explanation instead of a request the
    // server would only 413.
    if (btn.dataset.over) {
      note(overLimitNote(`“${btn.dataset.name}” holds`, btn.dataset.over,
        'Open it and index a subfolder that fits, or index books individually.'));
    } else queueFolder(btn);
  });
}

// "Index all" on a search's result header: every result not yet in the
// library, one request, same byte ceiling as folders.
$('#crumb').addEventListener('click', async e => {
  const btn = e.target.closest('.ixall');
  if (!btn || btn.disabled) return;
  // Same rule as a folder, so the same treatment: live button, stated reason.
  if (btn.dataset.over) return note(overLimitNote('These results hold', btn.dataset.over,
    'Narrow the search, or index books individually from the list.'));
  const ids = shown.filter(f => !f.indexed).map(f => f.file_id);
  if (!ids.length) return;
  btn.disabled = true;
  btn.textContent = 'Queueing…';
  try {
    const d = await fetchJSON('/api/drive/files/index', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ file_ids: ids })
    }, 30000);
    btn.textContent = d.queued ? `Queued ${d.queued}` : 'Already yours';
    refreshBooks();
    if (d.queued) setTimeout(runSearch, 2500);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Index all';
    failed($('#files'), `Could not queue those results — ${err.message || err}`, runSearch);
  }
});

// ---------------------------------------------------------------- search --

// Failures offer the action that resolves them. A dead end with no way forward
// is what makes a page feel broken rather than merely slow.
function failed(el, message, retry) {
  el.innerHTML = `<div class="failnote">${esc(message)}` +
    (retry ? `<button class="retry">Try again</button>` : '') + `</div>`;
  if (retry) el.querySelector('.retry').addEventListener('click', retry);
}

async function runSearch() {
  const q = $('#sq').value.trim();
  if (!q) return;
  searching = true;
  clearTimeout(pollTimer);
  $('#crumb').textContent = '';
  // A title search embeds the query over the network first, so ~1s is normal
  // and 8s already means something is wrong upstream of us.
  const p = progress($('#files'), {
    label: `Searching 57,000 books for “${q}”`,
    normal: 8,
    hint: 'Embedding the query — this normally takes about a second.',
  });
  try {
    const d = await fetchJSON(
      `/api/drive/search?q=${encodeURIComponent(q)}`, {}, 30000);
    p.stop();
    // What the whole result set weighs, and the one-click way to take it all.
    // The button covers only the un-indexed remainder, same byte ceiling as
    // folders -- the server re-checks, this just saves the failed round trip.
    const newOnes = d.results.filter(f => !f.indexed);
    const newMb = Math.round(newOnes.reduce((a, f) => a + (f.size_mb || 0), 0) * 10) / 10;
    const totalMb = Math.round(d.results.reduce((a, f) => a + (f.size_mb || 0), 0) * 10) / 10;
    let ixall = '';
    if (newOnes.length && LIMIT_MB != null && newMb > LIMIT_MB) {
      ixall = `<button class="btn ixall" data-over="${esc(mb(newMb))}" ` +
        `title="Too large to index in one action — click to see why">` +
        `Index all (${newOnes.length})</button>`;
    } else if (newOnes.length) {
      ixall = `<button class="btn ixall" title="Queue the ${newOnes.length} result(s) not yet in your library">` +
        `Index all (${newOnes.length})</button>`;
    }
    $('#crumb').innerHTML =
      `<span class="here">${d.results.length} result(s) for “${esc(q)}”</span>` +
      `<span class="sep">·</span> ${esc(mb(totalMb))} total · across the whole drive · ${p.seconds()}s ${ixall}` +
      `<button class="btn clearsearch">Back to browsing</button>`;
    shown = d.results;
    $('#files').innerHTML = d.results.length
      ? `<div class="fhead"><div>Name</div><div class="fwhere">Location</div><div>Size</div><div></div></div>` +
        d.results.map(fileRow).join('')
      : '<div class="empty">Nothing matched. Try fewer or more general words.</div>';
  } catch (err) {
    p.stop();
    failed($('#files'), `Search failed after ${p.seconds()}s — ${err.message || err}`,
           runSearch);
  }
}

$('#sf').addEventListener('submit', e => { e.preventDefault(); runSearch(); });

// Leaving a result list is now offered BY the result list, not by a toolbar
// button that sat there meaning nothing for as long as you were browsing.
// `current` is untouched by runSearch, so this returns to the folder you
// searched from rather than dumping you at the roots.
$('#crumb').addEventListener('click', e => {
  if (!e.target.closest('.clearsearch')) return;
  $('#sq').value = '';
  open(current);
});

// ----------------------------------------------------------------- index --

// Same endpoint the librarian's cards use. The page never writes to the
// library except through this one explicit action.
$('#files').addEventListener('click', async e => {
  const btn = e.target.closest('.ix');
  if (!btn) return;
  const f = shown[Number(btn.dataset.i)];
  btn.disabled = true;
  btn.textContent = 'Queueing…';
  try {
    // The route fetches this book's real metadata from Drive before queueing,
    // so it is a network call, not a local insert.
    const d = await fetchJSON('/api/library/drive', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ file_ids: [f.file_id] })
    }, 30000);
    btn.textContent = d.added.length ? 'Queued' : 'Already yours';
    refreshBooks();
    if (!searching) setTimeout(() => open(current), 1200);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Index';
    failed($('#crumb'), `Could not queue that book — ${err.message || err}`, null);
    // Most likely cause by far, and the one with a fix the user can act on.
    refreshAuth();
  }
});

// ------------------------------------------------------------- librarian --
// Same SSE contract as /api/research: `data: {json}\n\n` frames off a reader.
// Streamed because the agent runs several Drive searches over tens of seconds,
// and showing which ones it chose is what separates a shortlist you can trust
// from a list of plausible-looking titles.

$('#librarianbtn').addEventListener('click', () => {
  const el = $('#librarian');
  el.hidden = !el.hidden;
  $('#librarianbtn').classList.toggle('on', !el.hidden);
  if (!el.hidden) $('#bq').focus();
});

const TOOL_LABEL = {
  search_drive: 'search', browse_folder: 'browse',
  estimate_pipeline: 'estimate', recommend: 'shortlist',
};

function toolLine(e) {
  const i = e.input || {};
  const arg = i.query || i.name_contains || i.folder_id || '';
  return `<div class="bstep"><span class="lbl">${esc(TOOL_LABEL[e.name] || e.name)}</span>` +
         `${arg ? `“${esc(String(arg))}”` : ''}</div>`;
}

function resultLine(s) {
  const bits = [];
  if (s.returned != null) bits.push(`${s.returned} found`);
  if (s.total_pdfs != null && s.truncated) bits.push(`of ${s.total_pdfs}`);
  if (s.already_indexed) bits.push(`${s.already_indexed} already yours`);
  // "hit the limit" used to sit here and was shown on EVERY mirror search --
  // a KNN ranker always fills its page, so it announced a ceiling that was not
  // real. Only the live-Drive fallback can genuinely run short.
  if (s.hit_limit) bits.push('hit the limit');
  // The honest version of "is this topic actually in the collection": titles
  // both rankers agreed on. Only worth saying when it is zero -- that is the
  // case where a full-looking list of 50 is really just nearest neighbours.
  if (s.word_and_meaning === 0) bits.push('nothing matched on words — nearest by meaning only');
  if (s.picks != null) bits.push(`${s.picks} picked`);
  return bits.length
    ? `<div class="bstep"><span class="lbl"></span>${esc(bits.join(' · '))}</div>` : '';
}

function recCard(b, i) {
  // A pick whose file_id the agent never actually saw is shown as an error, not
  // rendered as a card -- a dead Drive link that looks real is worse than none.
  if (b.unknown) {
    return `<div class="rec bad"><div class="body"><div class="t">Unusable suggestion</div>` +
           `<div class="why">${esc(b.error)}</div></div></div>`;
  }
  const size = b.size_mb != null ? `${b.size_mb} MB` : 'size unknown';
  const action = b.indexed
    ? `<span class="badge good">Already yours</span>`
    : `<button class="btn add" data-i="${i}">Index</button>`;
  return `<div class="rec${b.indexed ? ' owned' : ''}">` +
    `<div class="body"><div class="t">${esc(b.title)}</div>` +
    `<div class="why">${esc(b.why || '')}</div>` +
    `<div class="m">${esc(size)} · <a href="${esc(b.url)}" target="_blank" rel="noopener">view in Drive</a></div>` +
    `</div>${action}</div>`;
}

let recs = [];

$('#bf').addEventListener('submit', async e => {
  e.preventDefault();
  const interest = $('#bq').value.trim();
  if (!interest) return;
  $('#bgo').disabled = true;
  $('#btrail').innerHTML = '<div class="bstep">looking…</div>';
  $('#bout').innerHTML = '';
  recs = [];

  const trail = [];
  try {
    const r = await fetch('/api/browse', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ interest })
    });
    if (!r.ok) throw new Error(r.statusText);
    await readEventStream(r, ev => {
        if (ev.type === 'tool') trail.push(toolLine(ev));
        else if (ev.type === 'results') trail.push(resultLine(ev.summary));
        else if (ev.type === 'tool_error') {
          trail.push(`<div class="bstep berr">${esc(ev.name)} failed — ${esc(ev.message)}</div>`);
        } else if (ev.type === 'recommendations') {
          recs = ev.books;
          $('#bout').innerHTML = recs.map(recCard).join('');
        } else if (ev.type === 'answer') {
          $('#bout').insertAdjacentHTML('beforeend',
            `<div class="sub" style="margin-top:10px">${esc(ev.text)}</div>`);
        } else if (ev.type === 'error') {
          $('#bout').insertAdjacentHTML('beforeend', `<div class="berr">${esc(ev.message)}</div>`);
        }
        $('#btrail').innerHTML = trail.join('');
    }, {
      terminal: 'done',
      onStall: secs => {
        trail.push(`<div class="bstep">no update for ${secs}s — still connected.</div>`);
        $('#btrail').innerHTML = trail.join('');
      },
    });
  } catch (err) {
    $('#bout').innerHTML = `<div class="berr">${esc(String(err.message || err))}</div>`;
  } finally {
    $('#bgo').disabled = false;
  }
});

// The agent recommends; the button acts. Nothing the agent does writes to the
// library -- adding a book is always an explicit choice made here.
$('#bout').addEventListener('click', async e => {
  const btn = e.target.closest('.add');
  if (!btn) return;
  const book = recs[Number(btn.dataset.i)];
  btn.disabled = true;
  btn.textContent = 'Queueing…';
  try {
    const r = await fetch('/api/library/drive', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ file_ids: [book.file_id] })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || `failed (${r.status})`);
    btn.textContent = d.added.length ? 'Queued' : 'Already yours';
    // The queue page and the sidebar report the ingest from here on -- no
    // second progress mechanism needed.
    refreshBooks();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Retry';
    $('#bout').insertAdjacentHTML('beforeend', `<div class="berr">${esc(String(err.message || err))}</div>`);
  }
});

refreshAuth();
refreshStatus();
buildTree();
refreshBooks();
</script>
</body>
</html>
