name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point tests at the service container (mapped to host port 5432).
      DATABASE_URL: postgresql://app:app@localhost:5432/library

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check

      - name: Test
        run: pytest -v
